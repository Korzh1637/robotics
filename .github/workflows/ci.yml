name: ROS checks

on:
  push:
    branches:
      - 'pr*'
  pull_request:
    branches:
      - 'pr*'

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-2bd3098044c5.tar.gz
  COURSE_KIT_SHA256: 2bd3098044c5444cf6bd11ca4ab051d08984b807d8eb5ea6f50c1714820c0b19

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Определить номер ПР из имени ветки
        id: pr
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"                                  # pr03
          PR_UPPER=$(echo "$BRANCH_NAME" | tr '[:lower:]' '[:upper:]')      # PR03
          PR_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')      # pr03
          echo "PR_UPPER=$PR_UPPER" >> $GITHUB_ENV
          echo "PR_LOWER=$PR_LOWER" >> $GITHUB_ENV
          echo "Проверяем $PR_UPPER, папка evidence/$PR_LOWER"

      - name: Validate environment JSON
        shell: bash
        run: python3 -m json.tool "evidence/${PR_LOWER}/environment.json" > /dev/null

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py "$PR_UPPER" --submission .
