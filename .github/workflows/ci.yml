name: PR06

on: [push, pull_request]

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: osrf/ros@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      ROS_DOMAIN_ID: '43'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      QT_QPA_PLATFORM: offscreen
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
      COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
    steps:
      # GitVerse запускает JavaScript actions через node внутри job-контейнера.
      # ROS-образ не содержит Node; он нужен и для main, и для post checkout.
      - name: Определение номера лабораторной работы
        id : pr
        shell : bash
        run : |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          code=$(echo "$ref" | tr '[:lower:]' '[:upper:]')
          code_lower=$(echo "$ref" | tr '[:upper:]' '[:lower:]')
          echo "code=$code"              >> "GITHUB_OUTPUT"
          echo "code_lower=$code_lower"  >> "GITHUB_OUTPUT"
          echo "dir=evidence/$ref"       >> "GITHUB_OUTPUT"

      - name: Подготовить Node для checkout и его завершающего шага
        shell: bash
        run: |
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      
      - name: Получить всю историю коммитов
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit/${{ steps.pr.outputs.code_lower }}
          tar -xzf course-kit.tar.gz -C .course-kit/${{ steps.pr.outputs.code_lower }}
      - name: Собрать пакеты, запустить тесты и опыт ${{ steps.pr.outputs.code }}
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select course_description
          source install/setup.bash
          python3 .course-kit/${{ steps.pr.outputs.code_lower }}/v1/tools/check_practice.py ${{ steps.pr.outputs.code }} --submission .
      - name: Проверить версию архива и контракт evidence
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/${{ steps.pr.outputs.code_lower }}/report.json').read_text())
          assert report['course_kit']['version'] == 'v1-w07'
          assert report['course_kit']['archive_sha256'] == os.environ['COURSE_KIT_SHA256']
          PYTHON
          python3 .course-kit/${{ steps.pr.outputs.code_lower }}/v1/tools/check_practice.py ${{ steps.pr.outputs.code }} --submission .
